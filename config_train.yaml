dashboard:
  layout: wide
  page_icon: crowd
  title: Kumbh Mela Crowd Detection System
dataset:
  annotation_dir: data/ucf_cc50/ground_truth
  image_dir: data/ucf_cc50/images
  image_size:
  - 224
  - 224
  name: UCF_CC50
  root_dir: data/ucf_cc50
  train_split: 0.8
  val_split: 0.2
model:
  architecture: CSRNet
  backbone: vgg16
  best_model_path: models/best_crowd_density.pth
  checkpoint_dir: models
  pretrained_backbone: true
risk:
  density_thresholds:
    high: 0.3
    low: 0.05
    moderate: 0.15
    very_high: 0.5
  risk_levels:
    high: High
    low: Low
    moderate: Medium
    very_high: Critical
  risk_scores:
    high:
    - 51
    - 75
    low:
    - 0
    - 25
    moderate:
    - 26
    - 50
    very_high:
    - 76
    - 100
  status_labels:
    high: High
    low: Low
    moderate: Moderate
    very_high: Very High
training:
  batch_size: 2
  early_stopping_patience: 5
  epochs: 15
  learning_rate: 0.0001
  lr_scheduler: cosine
  num_workers: 0
  pretrained_backbone: true
  save_every: 5
  use_gpu: true
  weight_decay: 0.001
video:
  frame_sample_rate: 10
  heatmap_alpha: 0.4
  heatmap_colormap: jet
  max_frames: null
  output_fps: 15
